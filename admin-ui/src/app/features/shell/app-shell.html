<div class="flex h-screen bg-slate-50">
  <aside class="flex w-56 flex-shrink-0 flex-col justify-between border-r border-slate-200 bg-white">
    <div>
      <div class="flex h-14 items-center border-b border-slate-200 px-4">
        <span class="text-sm font-semibold text-slate-900">CS Support 管理</span>
      </div>
      <nav class="mt-2 flex flex-col gap-0.5 px-2">
        <a
          routerLink="/threads"
          routerLinkActive="bg-primary-soft text-primary"
          [routerLinkActiveOptions]="{ exact: false }"
          class="rounded px-3 py-2 text-sm font-medium text-slate-600 hover:bg-slate-50"
        >
          スレッド一覧
        </a>
      </nav>
    </div>
    <div class="border-t border-slate-200 p-3">
      <button
        type="button"
        class="w-full rounded px-3 py-2 text-left text-sm font-medium text-slate-600 hover:bg-slate-50"
        (click)="onSignOut()"
      >
        サインアウト
      </button>
    </div>
  </aside>
  <main class="flex-1 overflow-y-auto p-6">
    <ng-content></ng-content>
  </main>
</div>
