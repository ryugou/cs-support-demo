<div class="flex min-h-screen items-center justify-center bg-slate-50">
  <div class="w-80 rounded-lg border border-slate-200 bg-white p-8 shadow-sm">
    <h1 class="text-center text-lg font-semibold text-slate-900">CS Support 管理画面</h1>
    <p class="mt-2 text-center text-sm text-slate-500">
      会話閲覧・訂正登録・利用状況の把握には Google アカウントでのログインが必要です。
    </p>

    @if (auth.signInError(); as message) {
      <div class="mt-4 rounded border border-rose-200 bg-rose-50 px-3 py-2 text-sm text-rose-700">
        {{ message }}
      </div>
    }

    <button
      type="button"
      class="mt-6 w-full rounded bg-primary px-4 py-2 text-sm font-medium text-white hover:bg-primary-hover"
      (click)="onSignIn()"
    >
      Google でログイン
    </button>
  </div>
</div>
