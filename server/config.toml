bind_addr = "127.0.0.1:3000"
vegapunk_endpoint = "http://127.0.0.1:16840"
# 管理 SPA（/admin）の静的ビルド成果物。`server/` から `cargo run` する運用のため
# `admin-ui/` は 1 階層上。ビルドコマンドは admin-ui/README または CLAUDE.md を参照。
admin_static_dir = "../admin-ui/dist/admin-ui/browser"

[[projects]]
project_id = "sivira-cs-demo"
schema = "sivira-cs-demo"

[harness]
audit_log_path = "data/audit/audit.jsonl"
search_improvement_queue_path = "data/audit/search-improvement-queue.jsonl"
signal_lexicon_path = "data/signal-lexicon.json"
ng_dictionary_path = "data/ng-dictionary.json"
policy = "escalate_unless_answerable"

[harness.thresholds]
low = 0.6
mid = 0.8
high = 0.95

# S1-11 追記 4 の仮置き値。業務確認で確定させる
[harness.grading]
promote_approvals = 3
promote_approvers = 2
promote_max_rejection_rate = 0.2
demote_rejections = 2

# 応答生成 API（POST /{project_id}/api/reply）。ローカルでは使わない。
[api]
enabled = false
clarify_max_turns = 3

[api.business_hours]
days = "mon-fri"
start = "10:00"
end = "18:00"
tz = "Asia/Tokyo"
