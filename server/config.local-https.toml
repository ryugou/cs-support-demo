bind_addr = "127.0.0.1:3443"
tls_cert_path = "certs/cert.pem"
tls_key_path = "certs/key.pem"
vegapunk_endpoint = "http://vegapunk.local:6840"

[[projects]]
project_id = "sivira-cs-demo"
schema = "sivira-cs-demo"

[auth]
# jwt_secret_file = "/path/to/jwt-secret"   # env CS_SUPPORT_JWT_SECRET_FILE で上書き
default_actor = "op-001"                     # dev 専用フォールバック（JWT 未設定時のみ）

[[actors]]
sub = "op-001"
role = "operator"
allowed_schemas = ["sivira-cs-demo"]

[[actors]]
sub = "sup-001"
role = "supervisor"
allowed_schemas = ["sivira-cs-demo"]

[harness]
audit_log_path = "data/audit/audit.jsonl"
search_improvement_queue_path = "data/audit/search-improvement-queue.jsonl"
signal_lexicon_path = "data/signal-lexicon.json"
ng_dictionary_path = "data/ng-dictionary.json"
policy = "escalate_unless_answerable"

[harness.thresholds]
low = 0.6
mid = 0.8
high = 0.95

# S1-11 追記 4 の仮置き値。業務確認で確定させる
[harness.grading]
promote_approvals = 3
promote_approvers = 2
promote_max_rejection_rate = 0.2
demote_rejections = 2

# signal 抽出エージェント（S1-11 改訂: lexicon ∪ LLM のハイブリッド）。
# 既定は enabled = false（lexicon 単独・オフライン動作・API キー不要）。
# 有効化する場合は enabled = true にし、API キーを env CS_SUPPORT_LLM_API_KEY
# または api_key_file のいずれかで注入すること（config に平文キーを書かない）。
# enabled = true で鍵を解決できない場合は起動時 fail closed で失敗する。
# [llm]
# enabled = true
# model = "claude-haiku-4-5-20251001"
# endpoint = "https://api.anthropic.com/v1/messages"
# api_key_file = "/path/to/llm-api-key"   # または env CS_SUPPORT_LLM_API_KEY
# timeout_secs = 20
# max_tokens = 300
