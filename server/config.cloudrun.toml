# Cloud Run 本番構成。
# bind_addr / vegapunk_endpoint は BIND_ADDR / VEGAPUNK_ENDPOINT の env で上書きされる
# （server/src/config.rs::AppConfig::load）。認証は Google OAuth 一本（静的 JWT は撤去済み）。
# aud 照合は env CS_SUPPORT_GOOGLE_OAUTH_CLIENT_ID。
# email ホワイトリスト（[[actors]]）は廃止した。アクセス制御は将来 DB ベースで実装する
# 方針であり、config と DB の二重の正本を避けるため、当面はホワイトリストなしで運用する
# （検証済み Google email はすべて supervisor role で受け入れる。詳細は
# server/src/harness/authn.rs の Authenticator doc comment を参照）。
# ここに書く値は env 未設定時のフォールバックであり、Cloud Run では常に env を注入する運用とする。
bind_addr = "0.0.0.0:8080"
# VPC peering 越しの punkrecord-egghead 実 IP。Cloud Run では env VEGAPUNK_ENDPOINT で上書きする。
vegapunk_endpoint = "http://10.10.0.2:6840"

# project は urtect 1 件に絞る。`Authenticator` は `allowed_schemas` に config 全 project の
# schema を複製するため（server/src/harness/authn.rs）、project を増やすとその schema も
# 既存の全 Google 利用者へ自動的に公開される。email ホワイトリスト廃止後はこれを止める
# 認可境界が無いので、露出面を最小化するためレガシーの sivira-cs-demo を外した。
# 新しい project を足すときは、テナント分離が成立しているかを先に確認すること。
#
# さらに、**ここを 2 件以上にすると OAuth の挙動が破壊的に変わる**。
# project が 1 件のうちは RFC 8707 の `resource` の省略を許すが、2 件以上になると
# `resource` が **必須** になり、送らないクライアントは invalid_target で拒否される
# （server/src/oauth/authserver.rs の resolve_resource。2 件以上を検知すると
# 起動時に警告ログを 1 回出す）。既存クライアントの接続が一斉に落ちる形で現れる。
#
# **ただし `resource` を送ってもテナント分離にはならない。** クライアントが持つのは
# Google 発行のアクセストークンで、こちらの project_id を載せる余地が無いため、
# ある project 向けに取得したトークンは全 project の endpoint で通る。
# project を足す前に、認可境界そのものを設計し直すこと。
[[projects]]
project_id = "urtect"
schema = "urtect"
manual_schema = "manual_v1"

# harness は AppConfig 全体で 1 系統（project ごとには分かれない）。
# audit_log_path / search_improvement_queue_path は GCS ボリュームマウント先の絶対パスにする
# （resolve_path は絶対パスをそのまま使う。config_dir 基準の相対解決をしない）。
# lexicon / ng は urtect 用（イメージ内 data/urtect/... 、WORKDIR /app/server からの相対）を使う。
[harness]
audit_log_path = "/data/audit/audit.jsonl"
search_improvement_queue_path = "/data/audit/search-improvement-queue.jsonl"
signal_lexicon_path = "data/urtect/signal-lexicon.json"
ng_dictionary_path = "data/urtect/ng-dictionary.json"
policy = "escalate_unless_answerable"
default_escalation_route = "support_desk"
# 意味検索（ベクトル経路）: urtect は embeddings ingest 済みのため有効化
vector_route_enabled = true

[harness.thresholds]
low = 0.6
mid = 0.8
high = 0.95

# S1-11 追記 4 の仮置き値。業務確認で確定させる
[harness.grading]
promote_approvals = 3
promote_approvers = 2
promote_max_rejection_rate = 0.2
demote_rejections = 2

# signal 抽出エージェント（S1-11 改訂: lexicon ∪ LLM のハイブリッド）。
# API キーは env CS_SUPPORT_LLM_API_KEY（Secret Manager injection）から注入する。
# enabled = true で鍵を解決できない場合は起動時 fail closed で失敗する。
[llm]
enabled = true
