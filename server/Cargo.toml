[package]
name = "cs-support-mcp"
version = "0.1.0"
edition = "2021"
# Option::is_none_or (1.82 安定化) 等を使用。ビルド環境の下限を明示する。
rust-version = "1.82"
build = "build.rs"

[dependencies]
anyhow = "1"
async-trait = "0.1"
axum = "0.8"
axum-server = { version = "0.8", features = ["tls-rustls"] }
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive", "env"] }
jsonwebtoken = "9"
http = "1"
prost = "0.13"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
rmcp = { version = "1.7", features = ["server", "transport-streamable-http-server", "transport-io", "macros"] }
rustls = "0.23"
schemars = "1"
scraper = "0.20"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sha2 = "0.10"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal"] }
toml = "0.8"
tonic = { version = "0.12", features = ["transport"] }
tower-http = { version = "0.6", features = ["trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
unicode-normalization = "0.1"
url = "2"
uuid = { version = "1", features = ["v4"] }

[build-dependencies]
tonic-build = "0.12"

[[bin]]
name = "cs-support-mcp"
path = "src/main.rs"

[[bin]]
name = "ingest_demo"
path = "src/bin/ingest_demo.rs"

[[bin]]
name = "verify_demo"
path = "src/bin/verify_demo.rs"

[[bin]]
name = "ingest_rules"
path = "src/bin/ingest_rules.rs"

[[bin]]
name = "ingest_urtect"
path = "src/bin/ingest_urtect.rs"
