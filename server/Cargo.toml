[package]
name = "cs-support-mcp"
version = "0.1.0"
edition = "2021"
# Option::is_none_or (1.82 安定化) 等を使用。ビルド環境の下限を明示する。
rust-version = "1.82"
build = "build.rs"

[dependencies]
anyhow = "1"
async-trait = "0.1"
axum = "0.8"
axum-server = { version = "0.8", features = ["tls-rustls"] }
# OAuth の署名ブロブ（client_id / state / 認可コード / トークン）を URL・クエリに
# 載せるため、base64url（パディング無し）符号化が要る。
base64 = "0.22"
# Google の refresh_token を含むブロブ（認可コード・同意ブロブ・リフレッシュトークン）の
# AEAD 封緘に使う。これらはクライアントのブラウザ・URL・トークンストアに渡るため、
# HMAC 署名だけでは中身が base64 平文で読めてしまう（`signing.rs` の `seal` を参照）。
# 既存の `hmac` / `sha2` と同じ RustCrypto 系統で揃えるため aes-gcm ではなくこちらを選ぶ。
# `getrandom` は nonce を OS CSPRNG から引くために必要。
chacha20poly1305 = { version = "0.10", features = ["getrandom"] }
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10.4"
clap = { version = "4", features = ["derive", "env"] }
# 署名ブロブの HMAC-SHA256。`verify_slice` の定数時間比較を使うために、
# sha2 だけで手組みせずこのクレートを使う（`==` 比較は署名の先頭一致長が
# 応答時間に漏れる）。
hmac = "0.12"
http = "1"
prost = "0.13"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
rmcp = { version = "1.7", features = ["server", "transport-streamable-http-server", "transport-io", "macros"] }
rustls = "0.23"
schemars = "1"
scraper = "0.20"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sha2 = "0.10"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "time"] }
toml = "0.8"
tonic = { version = "0.12", features = ["transport"] }
tower-http = { version = "0.6", features = ["trace", "fs", "set-header"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
unicode-normalization = "0.1"
url = "2"
uuid = { version = "1", features = ["v4"] }

[build-dependencies]
tonic-build = "0.12"

[dev-dependencies]
# health_router のルーティングを HTTP レベルで検証するための `oneshot`。
# axum 0.8 は tower 0.5 系の Service を使うため合わせる。
tower = { version = "0.5", features = ["util"] }
# Issue #52: `extract_signals_and_product_references` の並列発行を仮想時計
# （`#[tokio::test(start_paused = true)]` / `tokio::time::sleep`）で決定論的に検証するため。
# テストのみで使う機能なので `[dependencies]` 側の tokio には足さない
# （本番バイナリへ test-util を持ち込まない）。
tokio = { version = "1", features = ["test-util"] }
wiremock = "0.6.5"

[[bin]]
name = "cs-support-mcp"
path = "src/main.rs"

[[bin]]
name = "ingest_demo"
path = "src/bin/ingest_demo.rs"

[[bin]]
name = "verify_demo"
path = "src/bin/verify_demo.rs"

[[bin]]
name = "ingest_rules"
path = "src/bin/ingest_rules.rs"

[[bin]]
name = "ingest_urtect"
path = "src/bin/ingest_urtect.rs"

[[bin]]
name = "ingest_products"
path = "src/bin/ingest_products.rs"

[[bin]]
name = "ingest_alarmcom"
path = "src/bin/ingest_alarmcom.rs"

[[bin]]
name = "merge_schema"
path = "src/bin/merge_schema.rs"

[[bin]]
name = "line_adapter"
path = "src/bin/line_adapter.rs"

[[bin]]
name = "homesec_advisor"
path = "src/bin/homesec_advisor.rs"

[[bin]]
name = "ingest_homesec"
path = "src/bin/ingest_homesec.rs"
