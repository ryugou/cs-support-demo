name: Deploy Cloud Run

# main マージで build → push → deploy を常時実行し、server/data/** or schema/** の変更が
# あった場合のみ ingest-rules Job を自動実行する。手動実行（workflow_dispatch）は
# 既存イメージに対して recrawl（ingest-urtect: マニュアル再クロール）または
# rules（ingest-rules: 業務データ再投入）のいずれかを起動するだけで、再デプロイはしない
# （docs/superpowers/plans/2026-07-18-gcp-cloudrun-deploy.md Task 2）。
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      job:
        description: "手動実行する Job（recrawl=ingest_urtect 再クロール / rules=ingest_rules 業務データ再投入）"
        required: true
        type: choice
        options:
          - recrawl
          - rules

# 同時に複数回デプロイ・Job 実行が走ると Cloud Run 側の状態が競合するため、
# push / workflow_dispatch を問わず直列化する。実行中のデプロイを取り消すと
# 中途半端なリビジョンが残りかねないため cancel-in-progress は false にする。
concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read
  # Workload Identity Federation（キーレス認証）に必須。
  id-token: write

env:
  # NOTE: すべて GitHub Actions variables（vars.*）として Task 3 のプロビジョニング後に
  # gh CLI で設定する。secret ではなく values の追跡のため vars を使う。
  GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
  RUN_REGION: ${{ vars.RUN_REGION }}
  GAR_IMAGE: ${{ vars.GAR_IMAGE }}
  # 管理画面（/admin）が GIS（Google Identity Services）のログインに使う OAuth client_id。
  # 公開識別子なので secrets ではなく vars で扱う（cs-support-mcp service の
  # CS_SUPPORT_GOOGLE_OAUTH_CLIENT_ID env と同一の値。CLAUDE.md 参照）。
  # 未設定のままだと Dockerfile 側の admin-ui-builder ステージが fail closed で
  # ビルドを止める（誤った client_id を焼き込んだ「ログイン不能な /admin」を
  # 気づかず出荷しないため）。
  CS_SUPPORT_GOOGLE_OAUTH_CLIENT_ID: ${{ vars.CS_SUPPORT_GOOGLE_OAUTH_CLIENT_ID }}
  # CI が同一イメージ tag へ更新する対象。ここが唯一の正本で、CLAUDE.md の記述は
  # この 2 行に追従させる。リソースを増やしたらここに足す。
  RUN_SERVICES: "cs-support-mcp cs-support-line"
  RUN_JOBS: "ingest-products ingest-rules ingest-urtect ingest-alarmcom merge-schema verify-alarmcom backfill-concept-keys"

jobs:
  build-deploy:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      image_tag: ${{ steps.image.outputs.tag }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      # Rust の release ビルドを Docker 内で行うため、runner 側の未使用プリインストール
      # SDK を先に落として /var/lib/docker 用のディスク枠を確保する。
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          df -h /

      - name: Resolve image tag
        id: image
        run: echo "tag=${{ env.GAR_IMAGE }}:${{ github.sha }}" >> "$GITHUB_OUTPUT"

      - name: Resolve Artifact Registry host
        id: ar
        # GAR_IMAGE はフルイメージパス（例: asia-northeast1-docker.pkg.dev/PROJECT/cs-support/cs-support-mcp）。
        # login 先レジストリのホスト名だけを取り出す（RUN_REGION から再構成すると
        # リージョン名とホスト名の綴りがずれた場合に気づけないため、GAR_IMAGE 由来に統一する）。
        run: echo "host=$(echo '${{ env.GAR_IMAGE }}' | cut -d/ -f1)" >> "$GITHUB_OUTPUT"

      - name: Authenticate to Google Cloud (WIF)
        id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_SA_EMAIL }}
          # docker login 用に access token も出力させる（ADC ファイルは併せて作成される）。
          token_format: access_token

      - uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f # v2

      - name: Configure Docker auth to Artifact Registry
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4
        with:
          registry: ${{ steps.ar.outputs.host }}
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Build and push image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ steps.image.outputs.tag }}
            ${{ env.GAR_IMAGE }}:latest
          # CS_SUPPORT_GOOGLE_OAUTH_CLIENT_ID を渡さないと Dockerfile の
          # admin-ui-builder ステージが fail closed でビルドを落とす（上記 env 参照）。
          build-args: |
            CS_SUPPORT_GOOGLE_OAUTH_CLIENT_ID=${{ env.CS_SUPPORT_GOOGLE_OAUTH_CLIENT_ID }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Update Cloud Run job images
        # 対象は ingest-products / ingest-rules / ingest-urtect / ingest-alarmcom /
        # merge-schema / verify-alarmcom / backfill-concept-keys の 7 job。
        # いずれも cs-support-mcp と同一イメージを別バイナリ・別引数で起動する
        # （バイナリ選択は各 job のエントリポイント定義側の責務で、ここでは image tag
        # のみを更新する）。ループ内で `gcloud` が非 0 終了すると `run:` ステップの
        # 既定シェル（bash `-e` 相当）でそのままステップが失敗するため、途中の job で
        # 失敗した場合に後続を握りつぶして成功扱いにすることはない。
        # ここを service 更新より先に実行する理由（fail closed）:
        # job 更新は Cloud Run のリビジョンを作らず本番トラフィックに影響しないが、
        # service 更新は本番の live トラフィックを新イメージへ切り替える。
        # 対象リソースのいずれかが未作成・権限不足などで失敗したとき、job を先に
        # 更新しておけば本番 service は旧イメージのまま止まる。逆順だと、service
        # だけ新イメージに切り替わり job が旧イメージのまま取り残される
        # 部分デプロイが発生する。
        run: |
          for job in ${RUN_JOBS}; do
            echo "updating job: ${job}"
            gcloud run jobs update "${job}" \
              --project "${{ env.GCP_PROJECT_ID }}" \
              --region "${{ env.RUN_REGION }}" \
              --image "${{ steps.image.outputs.tag }}"
          done

      - name: Deploy Cloud Run services
        # サービス定義（VPC / secrets / メモリ等）は Task 3 の初回作成で固定済みのため、
        # CI からは image のみ更新する。`gcloud run deploy` は未指定フラグに CLI 既定値を
        # 適用しうる（既定値は gcloud のバージョンで変わる）ため、image 以外に触れない
        # `gcloud run services update` を使う。ここを `deploy` に戻すと、CLI 更新のたびに
        # サービス定義が静かに書き換わる経路が復活する。
        # 対象は cs-support-mcp（本体）と cs-support-line（LINE アダプタ、同一イメージを
        # 別コマンドで起動）の 2 service。ループ内で `gcloud` が非 0 終了すると
        # `run:` ステップの既定動作（bash `-e` 相当）でそのままステップが失敗するため、
        # 途中の service で失敗した場合に後続を握りつぶして成功扱いにすることはない。
        run: |
          for service in ${RUN_SERVICES}; do
            echo "updating service: ${service}"
            gcloud run services update "${service}" \
              --project "${{ env.GCP_PROJECT_ID }}" \
              --region "${{ env.RUN_REGION }}" \
              --image "${{ steps.image.outputs.tag }}"
          done

  auto-ingest:
    # 既知の制約: この job は build-deploy（service デプロイ）の "後" に走る。
    # schema/** に属性を加算した変更では、新コードが本番へ出てからスキーマ登録が
    # 行われるため、vegapunk が未登録属性を含む UpsertNodes を拒否する実装だと、
    # その間の書き込みが失敗する窓がある。
    # 回避策: schema/** を変更した PR は、merge 前に手で
    #   gcloud run jobs execute ingest-rules --project ... --region ... --wait
    # を実行してスキーマを先に登録しておくこと。
    # 恒久対応（未実施）: build と deploy を job 分割し、ingest を deploy の前に
    # 差し込む。条件付き job の skip 伝播（needs 先が skip されると後続も skip される）
    # の扱いが要るため、CI 単体で検証できる別 PR で行う。
    needs: build-deploy
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          # dorny/paths-filter が push の 1 つ前のコミットと比較できるよう履歴を残す
          # （shallow clone だと merge コミットの前が無く差分検知に失敗し得る）。
          fetch-depth: 0

      - name: Detect business-data changes
        id: filter
        uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706 # v4
        with:
          filters: |
            rules:
              - 'server/data/**'
              - 'schema/**'

      - name: Authenticate to Google Cloud (WIF)
        if: steps.filter.outputs.rules == 'true'
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_SA_EMAIL }}

      - name: Setup gcloud
        if: steps.filter.outputs.rules == 'true'
        uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f # v2

      - name: Execute ingest-rules job
        if: steps.filter.outputs.rules == 'true'
        run: |
          gcloud run jobs execute ingest-rules \
            --project "${{ env.GCP_PROJECT_ID }}" \
            --region "${{ env.RUN_REGION }}" \
            --wait

  manual-ingest:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Authenticate to Google Cloud (WIF)
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_SA_EMAIL }}

      - uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f # v2

      - name: Execute selected ingest job
        # 既存デプロイ済みイメージに対する手動実行のみ。再ビルド・再デプロイはしない
        # （このジョブは build-deploy に依存しない独立ジョブ）。
        run: |
          case "${{ inputs.job }}" in
            recrawl)
              gcloud run jobs execute ingest-urtect \
                --project "${{ env.GCP_PROJECT_ID }}" \
                --region "${{ env.RUN_REGION }}" \
                --wait
              ;;
            rules)
              gcloud run jobs execute ingest-rules \
                --project "${{ env.GCP_PROJECT_ID }}" \
                --region "${{ env.RUN_REGION }}" \
                --wait
              ;;
            *)
              echo "unknown job input: ${{ inputs.job }}" >&2
              exit 1
              ;;
          esac
