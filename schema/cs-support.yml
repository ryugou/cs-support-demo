name: cs-support-manual
version: 1
min_compatible: 1
description: "Generic manual-domain CS schema (knowledge types + manual document/section). Registered per tenant by schema name."

nodes:
  # --- knowledge types (Step 1 harness。cs-schema.yml と同一) ---
  KnownResolution:
    attributes:
      kr_id: { type: string, required: true }
      answer_text: { type: string, required: true }
      applicability: { type: string }
      grade: { type: string }
      status: { type: string }
      source_authority: { type: string }
      approval_count: { type: int }
      rejection_count: { type: int }
      approver_set: { type: string }
      origin: { type: string }
      created_by: { type: string }
      created_by_email: { type: string }
      verified_at: { type: string }
      error_axis: { type: string }
      root_cause: { type: string }
      owner: { type: string }
      binding: { type: string }
      direction: { type: string }
      route: { type: string }
      registration_trigger: { type: string }
      knowledge_class: { type: string }
      outcome_ref: { type: string }
      search_text_ja: { type: string }
  Signal:
    attributes:
      value: { type: string, required: true }
  Rationale:
    attributes:
      rationale_id: { type: string, required: true }
      text: { type: string, required: true }
  EscalationRule:
    attributes:
      rule_id: { type: string, required: true }
      condition: { type: string, required: true }
      owner: { type: string }
      sensitivity: { type: string }
      route: { type: string, required: true }
      binding: { type: string }
  ProhibitedDomain:
    attributes:
      domain_id: { type: string, required: true }
      pattern: { type: string, required: true }
      domain_signals: { type: string }
      route: { type: string, required: true }
      binding: { type: string }
  support_case:
    attributes:
      case_id: { type: string, required: true }
      request_id: { type: string }
      actor: { type: string }
      actor_email: { type: string }
      question: { type: string }
      product_key: { type: string }
      created_at: { type: string }
      last_request_id: { type: string }
      last_decision: { type: string }
      last_kr_id: { type: string }
      # Allowed-manual の場合のみ非空。evaluate() の decision_result から導出する根拠
      # （harness/mod.rs の case_attrs 組み立て。answer_evidence の元になる材料）。
      last_evidence_keys: { type: string }
      last_evidence_kind: { type: string }
      # 会話フロー v1.1（CaseConvState、harness/mod.rs::merge_conv_state_attributes）
      clarify_turns: { type: int }
      awaiting_time_pref: { type: string }
      time_pref_false_count: { type: int }
      preferred_contact_time: { type: string }
      time_pref_extraction_error_count: { type: int }
      # Issue #28 二段目確定の降格で除外された signal の CSV（harness/mod.rs::exclude_recorded_signals）
      excluded_signals: { type: string }
      # Issue #31 design doc §2: 匿名化済みエンドユーザー識別子（任意、初回提供時に設定）
      end_user_id: { type: string }
      # Issue #31 design doc §2: ConversationTurn.seq 採番用カウンタ（read-merge-write）
      turn_count: { type: int }
      # homesec advisor 固有加算（design doc `2026-08-17-homesec-advisor-design.md` §4.4）。
      # urtect（このスキーマ）では未使用。この一致テストが全 schema ファイルを対象にするため
      # 加算のみ行う（harness/knowledge.rs::written_support_case_attribute_keys）。
      lead_offered: { type: string }
      lead_requested: { type: string }
      shown_product_cards: { type: string }
      # 累積条件（design doc §4.2）。urtect（このスキーマ）では未使用。この一致テストが
      # 全 schema ファイルを対象にするため加算のみ行う（harness/knowledge.rs::
      # written_support_case_attribute_keys / advisor/decide.rs::CONDITION_ATTR_KEYS）。
      advisor_cond_housing: { type: string }
      advisor_cond_target: { type: string }
      advisor_cond_concern: { type: string }
      advisor_cond_budget: { type: string }
      advisor_cond_install: { type: string }
      # 会話のリズム改善（2026-08-21 conversation-rhythm-implementation §要件2）。
      # この属性は homesec advisor 専用で、urtect（このスキーマ）では書き込まれない。
      # ここに宣言するのは、3 schema ファイル（このファイル / cs-schema.yml / homesec.yml）
      # のキー一致テスト（harness/knowledge.rs::written_support_case_attribute_keys）を
      # 満たすためだけである。「加算のみ」はこのスキーマ変更自体が既存属性を壊さない加算的な
      # 変更であることを指し、この属性の**値**が加算されるだけでリセットされない、という意味
      # ではない（値は advisor/decide.rs::next_question_streak が質問系 closing で加算、
      # proposal closing で 0 にリセットする）。
      question_streak: { type: int }
  answer_attempt:
    attributes:
      attempt_id: { type: string, required: true }
      case_id: { type: string }
      request_id: { type: string }
      actor: { type: string }
      actor_email: { type: string }
      draft: { type: string }
      decision: { type: string }
      evaluation_request_id: { type: string }
      known_resolution_id: { type: string }
      egress_verdict: { type: string }
      outcome: { type: string }
      outcome_actor: { type: string }
      # 承認者の認証時点 email。安定 ID だけだと、隣接する起票者の actor_email が
      # 承認者のものと誤読される。同一人物判定には使わない（当時の値）。
      outcome_actor_email: { type: string }
      outcome_note: { type: string }
      audit_event_id: { type: string }
      created_at: { type: string }
  answer_evidence:
    attributes:
      evidence_id: { type: string, required: true }
      attempt_id: { type: string }
      section_key: { type: string }
      kind: { type: string }
  operator_feedback:
    attributes:
      feedback_id: { type: string, required: true }
      attempt_id: { type: string }
      request_id: { type: string }
      actor: { type: string }
      actor_email: { type: string }
      feedback_source: { type: string }
      corrected_answer: { type: string }
      routing: { type: string }
      created_at: { type: string }
  escalation_event:
    attributes:
      escalation_id: { type: string, required: true }
      case_id: { type: string }
      request_id: { type: string }
      actor: { type: string }
      actor_email: { type: string }
      layer: { type: int }
      reason: { type: string }
      route_to: { type: string }
      question: { type: string }
      created_at: { type: string }
  # Issue #31 design doc §2: /api/reply の応答確定点で 1 ターン = 1 ノードを書き切る
  # （immutable、部分更新なし）。埋め込みベクトルは持たない（検索非汚染。§2 受け入れ条件）。
  # 属性・required は harness/knowledge.rs の build_conversation_turn_graph が実際に書く
  # 値に一致させてある（end_user_id のみ Some のときだけ書くため任意）。
  ConversationTurn:
    attributes:
      turn_id: { type: string, required: true }
      case_id: { type: string, required: true }
      end_user_id: { type: string }
      seq: { type: int, required: true }
      created_at: { type: string, required: true }
      question: { type: string, required: true }
      reply_text: { type: string, required: true }
      reply_kind: { type: string, required: true }
      audit_event_id: { type: string, required: true }
  # --- manual domain (template v1) ---
  Product:
    attributes:
      product_key: { type: string, required: true }   # = model（安定 upsert キー）
      name: { type: string, required: true }
      model: { type: string }
      aliases: { type: string }
  ManualDocument:
    attributes:
      doc_key: { type: string, required: true }
      title: { type: string, required: true }
      source_url: { type: string, required: true }
      fetched_at: { type: string, required: true }
  ManualSection:
    attributes:
      section_key: { type: string, required: true }
      doc_key: { type: string }
      title: { type: string, required: true }
      body: { type: string, required: true }
      source_url: { type: string, required: true }
      breadcrumb: { type: string, required: true }
      section_no: { type: string }
      order: { type: int, required: true }
      source_lang: { type: string, required: true }
      content_hash: { type: string, required: true }
      # 多言語予約（純予約・空可・駆動コードは読まない）
      body_original: { type: string }
      original_hash: { type: string }
      # Issue #8 B2: MENTIONS_CONCEPT 辺の読み取り最適化射影。JSON 配列文字列（型は string 固定のため）。
      concept_keys: { type: string }
  # Issue #8 v2: answers.alarm.com の概念クエリ（型番なしの自然文）・記事横断 join の拠り所。
  Concept:
    attributes:
      concept_key: { type: string, required: true }
      name_en: { type: string, required: true }
      name_ja: { type: string }
      # 表記揺れ辞書（カタカナ等）。JSON 配列文字列で保持する（型は string 固定のため）。
      aliases_ja: { type: string }
      kind: { type: string } # feature / rule / setting / term

edges:
  HAS_SIGNAL: { from: [KnownResolution, support_case], to: Signal }
  BECAUSE: { from: KnownResolution, to: Rationale }
  HAS_SECTION: { from: ManualDocument, to: ManualSection }
  PARENT_OF: { from: ManualSection, to: ManualSection }
  DESCRIBES: { from: ManualSection, to: Product }
  MENTIONS_SIGNAL: { from: ManualSection, to: Signal }
  MENTIONS_CONCEPT: { from: ManualSection, to: Concept }
  BASED_ON: { from: KnownResolution, to: ManualSection }
  # Issue #31 design doc §2
  HAS_TURN: { from: support_case, to: ConversationTurn }

traceable_pairs:
  - claim: KnownResolution
    evidence: Rationale
    edge: BECAUSE
  - claim: KnownResolution
    evidence: ManualSection
    edge: BASED_ON
